name: Aggiorna i dati

# Gira ogni notte alle 05:10 italiane (04:10 UTC in ora legale),
# e si puo' lanciare a mano dalla scheda Actions.
on:
  schedule:
    - cron: "10 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  # Rami da ricostruire, separati da spazio. Per aggiungerne uno
  # basta creare la sua cartella con config.json e scriverlo qui.
  RAMI: "A1 A2 A3"

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Prendi il repository
        uses: actions/checkout@v5

      - name: Prepara Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Scarica i dati e ricostruisci i dati.json
        run: python scripts/aggiorna_dati.py $RAMI

      - name: Salva il risultato
        run: |
          git config user.name "aggiornamento automatico"
          git config user.email "actions@github.com"
          for r in $RAMI; do
            if [ -f "$r/dati.json" ]; then git add "$r/dati.json"; fi
          done
          if git diff --cached --quiet; then
            echo "Nessuna variazione: non committo niente."
          else
            git commit -m "Dati aggiornati al $(date +'%d/%m/%Y') - rami: $RAMI"
            git push
          fi
