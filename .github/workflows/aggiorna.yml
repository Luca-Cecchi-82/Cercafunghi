name: Aggiorna i dati

# Gira ogni notte alle 05:10 italiane (04:10 UTC in ora legale),
# e si puo' lanciare a mano dalla scheda Actions.
on:
  schedule:
    - cron: "10 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Prendi il repository
        uses: actions/checkout@v5

      - name: Prepara Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Scarica i dati e ricostruisci dati.json
        run: python scripts/aggiorna_dati.py

      - name: Salva il risultato
        run: |
          git config user.name "aggiornamento automatico"
          git config user.email "actions@github.com"
          if git diff --quiet -- dati.json; then
            echo "Nessuna variazione: non committo niente."
          else
            git add dati.json
            git commit -m "Dati aggiornati al $(date +'%d/%m/%Y')"
            git push
          fi
