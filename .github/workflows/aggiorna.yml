name: Aggiorna i dati

# ORARI - attenzione: GitHub usa SEMPRE l'ora UTC e non conosce l'ora
# legale, quindi lo stesso cron cade un'ora piu' tardi in estate.
#
#   cron "37 0"  ->  02:37 italiane d'estate,  01:37 d'inverno
#   cron "22 11" ->  13:22 italiane d'estate,  12:22 d'inverno
#
# Il primo passaggio e' notturno perche' il SIR chiude la giornata a
# mezzanotte: due ore dopo il dato del giorno prima e' gia' pubblicato.
# Il secondo cade in pausa pranzo e fa da rete.
#
# Per spostare un orario: prendi l'ora italiana che vuoi, togli 2 in
# estate (1 in inverno) e scrivi il risultato qui sotto.
#
# Perche' due esecuzioni: gli orari programmati di GitHub non sono
# garantiti. Nei momenti di carico vengono ritardati di ore o saltati
# del tutto, e succede piu' spesso agli orari tondi, dove si accalcano
# tutti. Il minuto dispari evita la calca, la seconda esecuzione fa da
# rete se la prima salta. Rilanciare non fa danni: se i dati non sono
# cambiati lo script non committa niente.
on:
  schedule:
    - cron: "37 0 * * *"
    - cron: "22 11 * * *"
  workflow_dispatch:

# Se per qualche motivo due esecuzioni si accavallano, la seconda
# aspetta invece di scrivere sugli stessi file contemporaneamente.
concurrency:
  group: aggiorna-dati
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Rami da ricostruire, separati da spazio. Per aggiungerne uno
  # basta creare la sua cartella con config.json e scriverlo qui.
  RAMI: "A1 A2 A3"

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Prendi il repository
        uses: actions/checkout@v5

      - name: Prepara Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Scarica i dati e ricostruisci i dati.json
        run: python scripts/aggiorna_dati.py $RAMI

      - name: Salva il risultato
        run: |
          git config user.name "aggiornamento automatico"
          git config user.email "actions@github.com"
          for r in $RAMI; do
            if [ -f "$r/dati.json" ]; then git add "$r/dati.json"; fi
          done
          if git diff --cached --quiet; then
            echo "Nessuna variazione: non committo niente."
          else
            git commit -m "Dati aggiornati al $(date +'%d/%m/%Y') - rami: $RAMI"
            # se nel frattempo e' arrivato un altro commit, riallineo e riprovo
            git push || (git pull --rebase && git push)
          fi
